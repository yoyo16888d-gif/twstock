name: 每日更新台股資料

on:
  schedule:
    - cron: "10 7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 找出程式所在資料夾
        run: |
          if [ -f twstock_update.py ]; then echo "APP=." >> $GITHUB_ENV; else echo "APP=.github/workflows" >> $GITHUB_ENV; fi

      - name: 讀取已存的歷史資料
        run: |
          if git fetch -q origin data:data 2>/dev/null; then git show data:history.json > "$APP/history.json"; echo "已讀取歷史資料"; else echo "第一次執行，沒有歷史資料"; fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 下載證交所與櫃買中心資料
        env:
          TZ: Asia/Taipei
        run: python "$APP/twstock_update.py" --nopause

      - name: 保存歷史資料
        run: |
          mkdir -p /tmp/d && cp "$APP/history.json" /tmp/d/ && cd /tmp/d
          git init -q -b data && git add history.json
          git -c user.name="stock-bot" -c user.email="stock-bot@users.noreply.github.com" commit -qm "data $(TZ=Asia/Taipei date +%F)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data

      - name: 準備網站檔案
        run: mkdir -p _site && cp "$APP/index.html" "$APP/data.js" _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
