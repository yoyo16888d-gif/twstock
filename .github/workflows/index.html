<title>台股族群看盤</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: trading-terminal. Toolbar on top; three panes: chart stack (K + Vol + KD + MACD + RSI) | 族群強弱 board | 個股報價 list.
   Single deliberate dark look, Taiwan convention red = up, green = down, yellow = labels. */
:root{
  color-scheme:dark;
  --bg:#000000; --pane:#07090d; --pane-2:#0d1117; --line:#1c2230; --line-2:#2a3243;
  --ink:#d7dde8; --muted:#7c869a; --label:#f2c230; --accent:#41b6ff;
  --up:#ff3d3d; --down:#1ec25c; --flat:#c9cfda;
  --ma5:#f2c230; --ma20:#41b6ff; --ma60:#d36bff;
  --font-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:13px;line-height:1.4}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--pane-2)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:1px solid var(--label);outline-offset:1px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--flat)}

.app{height:100%;display:flex;flex-direction:column;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}

/* toolbar */
.tb{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;background:var(--pane-2);border-bottom:1px solid var(--line-2);
  padding-block:6px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.logo{font-weight:900;font-size:14px;color:var(--label);letter-spacing:.06em;white-space:nowrap}
.sym{position:relative}
.sym input{width:150px;background:#000;border:1px solid var(--line-2);padding:4px 8px;border-radius:3px;font-family:var(--font-num)}
.sug{position:absolute;top:100%;left:0;z-index:40;background:var(--pane-2);border:1px solid var(--line-2);width:240px;max-height:300px;overflow:auto}
.sug button{display:flex;gap:8px;width:100%;text-align:left;background:none;border:0;padding:5px 8px}
.sug button:hover,.sug button.on{background:var(--line)}
.quote{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;min-width:0}
.quote .nm{font-weight:700;font-size:15px;white-space:nowrap}
.quote .px{font-size:17px;font-weight:600}
.quote .meta{color:var(--muted);font-size:11px}
.tb .sp{flex:1}
.tbtn{background:#000;border:1px solid var(--line-2);border-radius:3px;padding:4px 10px;font-size:12px;white-space:nowrap}
.tbtn[aria-pressed="true"]{border-color:var(--label);color:var(--label)}
.tbtn.hot{background:var(--label);color:#000;border-color:var(--label);font-weight:700}
.date{color:var(--muted);font-size:11px;white-space:nowrap}

/* panes */
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 330px 290px;gap:1px;background:var(--line)}
.pane{background:var(--pane);min-width:0;min-height:0;display:flex;flex-direction:column}
.ph{display:flex;align-items:center;gap:8px;padding:5px 8px;border-bottom:1px solid var(--line);background:var(--pane-2);font-size:12px;white-space:nowrap;overflow-x:auto}
.ph .t{color:var(--label);font-weight:700}
.tabs{display:flex;gap:2px}
.tabs button{background:none;border:1px solid transparent;border-radius:3px;padding:1px 7px;color:var(--muted);font-size:12px}
.tabs button[aria-pressed="true"]{border-color:var(--line-2);color:var(--ink);background:#000}

/* chart stack */
.stack{flex:1;min-height:0;display:flex;flex-direction:column}
.cp{position:relative;min-height:0;border-bottom:1px solid var(--line)}
.cp .lab{position:absolute;left:6px;top:3px;z-index:3;font-size:11px;font-family:var(--font-num);pointer-events:none;display:flex;gap:10px;flex-wrap:wrap;text-shadow:0 0 3px #000}
.cp .lab .n{color:var(--label)}
.cp .c{position:absolute;inset:0}
#p-main{flex:4}#p-vol{flex:1.1}#p-kd{flex:1.2}#p-macd{flex:1.2}#p-rsi{flex:1.1}
.sigbar{display:flex;gap:6px;flex-wrap:wrap;padding:6px 8px;background:var(--pane-2);border-top:1px solid var(--line);min-height:32px;align-items:center}
.sg{font-size:11px;border:1px solid var(--line-2);border-radius:3px;padding:1px 6px;white-space:nowrap}
.sg.bull{color:var(--up);border-color:color-mix(in srgb,var(--up) 50%,transparent)}
.sg.bear{color:var(--down);border-color:color-mix(in srgb,var(--down) 50%,transparent)}
.sg.neu{color:var(--flat)}
.nohist{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:16px;background:color-mix(in srgb,var(--pane) 92%,transparent)}
.nohist .box{max-width:460px;display:flex;flex-direction:column;gap:8px;font-size:12px;color:var(--muted)}
.nohist b{color:var(--ink);font-size:14px}
.nohist a{color:var(--accent)}
.months{display:flex;flex-wrap:wrap;gap:4px}
.months a{border:1px solid var(--line-2);padding:1px 6px;border-radius:3px;text-decoration:none;font-family:var(--font-num);font-size:11px}
.nohist textarea{width:100%;min-height:54px;background:#000;border:1px solid var(--line-2);border-radius:3px;font-family:var(--font-num);font-size:11px;padding:6px}

/* breadth + group board */
.breadth{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.breadth div{background:var(--pane);padding:6px 8px;display:flex;flex-direction:column;align-items:center}
.breadth small{color:var(--muted);font-size:11px}
.breadth .v{font-size:18px;font-weight:600}
.bbar{height:5px;display:flex;margin:6px 8px 8px}
.bbar i{display:block;height:100%}
.board{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:1fr 1fr;align-content:start;gap:1px;background:var(--line)}
.gt{background:var(--pane);border:0;text-align:left;padding:7px 8px 6px;display:flex;flex-direction:column;gap:3px;min-width:0;position:relative}
.gt[aria-pressed="true"]{background:var(--pane-2);box-shadow:inset 0 0 0 1px var(--label)}
.gt .gn{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gt .gv{font-size:15px;font-weight:600}
.gt .gm{font-size:10px;color:var(--muted);display:flex;justify-content:space-between;gap:4px}
.gt .mini{height:3px;display:flex;background:var(--line-2)}
.gt .mini i{display:block;height:100%}

/* list */
.list{flex:1;min-height:0;overflow:auto}
.lr{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:0 10px;align-items:center;padding:4px 8px;border-bottom:1px solid var(--line);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.lr:hover{background:var(--pane-2)}
.lr.on{background:color-mix(in srgb,var(--label) 12%,var(--pane))}
.lr .a{display:flex;flex-direction:column;min-width:0}
.lr .a span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.lr .a small{color:var(--muted);font-family:var(--font-num);font-size:10px}
.lr .p{text-align:right;font-size:13px}
.lr .c{text-align:right;min-width:66px;font-size:12px}
.tag{font-size:10px;padding:0 3px;border-radius:2px;color:#000;margin-left:4px}
.tag.u{background:var(--up)} .tag.d{background:var(--down)}
.more{width:100%;background:var(--pane-2);border:0;border-top:1px solid var(--line);padding:8px;color:var(--accent)}
.empty{padding:20px;color:var(--muted);text-align:center}

/* drawers */
.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:flex;justify-content:flex-end}
.dr{width:min(380px,100%);height:100%;background:var(--pane-2);border-left:1px solid var(--line-2);overflow:auto;display:flex;flex-direction:column;gap:14px;
  padding-block:calc(env(safe-area-inset-top,0px) + 14px) calc(env(safe-area-inset-bottom,0px) + 14px);padding-left:16px;padding-right:max(16px,env(safe-area-inset-right,0px))}
.dr h2{margin:0;font-size:15px;color:var(--label);display:flex;justify-content:space-between;align-items:center}
.lbl{font-size:11px;color:var(--muted);letter-spacing:.06em;display:block;margin-bottom:5px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{background:#000;border:1px solid var(--line-2);border-radius:3px;padding:3px 9px;font-size:12px}
.chip[aria-pressed="true"]{border-color:var(--label);color:var(--label)}
.rg{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center}
.rg input,.dr input[type=number]{width:100%;min-width:0;background:#000;border:1px solid var(--line-2);border-radius:3px;padding:5px 7px}
.hint{font-size:11px;color:var(--muted)}
.hint a{color:var(--accent)}
.dr textarea{width:100%;min-height:90px;background:#000;border:1px solid var(--line-2);border-radius:3px;font-family:var(--font-num);font-size:11px;padding:6px}
.status{border:1px solid var(--line-2);border-radius:3px;padding:8px 10px;background:#000}
.status b{display:block;color:var(--ink)}
.dropz{border:1px dashed var(--line-2);border-radius:3px;padding:10px;font-size:11px;color:var(--muted)}
.dropz.over{border-color:var(--label)}

@media (max-width:1180px){.main{grid-template-columns:minmax(0,1fr) 300px}.pane.listp{grid-column:1/-1;max-height:420px}}
@media (max-width:820px){
  html,body{height:auto}.app{height:auto}
  .main{display:flex;flex-direction:column}
  .pane.chartp{height:78vh;min-height:520px}
  .pane.grpp{max-height:520px}.pane.listp{max-height:520px}
  .quote .meta{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <header class="tb">
    <span class="logo">族群看盤</span>
    <div class="sym"><input id="sym" placeholder="代號／名稱" autocomplete="off" aria-label="輸入股票代號"><div class="sug" id="sug" hidden></div></div>
    <div class="quote" id="quote"></div>
    <span class="sp"></span>
    <span class="date" id="dateLbl">尚未載入行情</span>
    <div class="tabs" role="group" aria-label="族群分類">
      <button class="tbtn" id="gm-ind" aria-pressed="true">產業別</button>
      <button class="tbtn" id="gm-thm" aria-pressed="false">熱門題材</button>
    </div>
    <button class="tbtn" id="openFilter" aria-pressed="false">篩選</button>
    <button class="tbtn hot" id="openData">更新行情</button>
  </header>

  <div class="main">
    <section class="pane chartp" aria-label="技術線圖">
      <div class="ph"><span class="t">技術分析</span><span id="chName" class="num"></span><span class="sp" style="flex:1"></span>
        <span class="hint" id="extLinks"></span></div>
      <div class="stack">
        <div class="cp" id="p-main"><div class="lab" id="l-main"></div><div class="c" id="c-main"></div>
          <div class="nohist" id="nohist" hidden><div class="box">
            <b id="nhTitle">正在下載歷史日K…</b>
            <span id="nhSub"></span>
            <div class="months" id="months"></div>
            <textarea id="hPaste" placeholder="把月份頁面的內容貼在這裡，每貼一個月會自動合併"></textarea>
            <div style="display:flex;gap:6px;flex-wrap:wrap"><button class="tbtn hot" id="hGo">載入歷史資料</button><label class="tbtn" for="hFile">上傳檔案</label><input type="file" id="hFile" accept=".json,.csv,.txt" multiple hidden></div>
          </div></div>
        </div>
        <div class="cp" id="p-vol"><div class="lab" id="l-vol"></div><div class="c" id="c-vol"></div></div>
        <div class="cp" id="p-kd"><div class="lab" id="l-kd"></div><div class="c" id="c-kd"></div></div>
        <div class="cp" id="p-macd"><div class="lab" id="l-macd"></div><div class="c" id="c-macd"></div></div>
        <div class="cp" id="p-rsi"><div class="lab" id="l-rsi"></div><div class="c" id="c-rsi"></div></div>
      </div>
      <div class="sigbar" id="sigs"></div>
    </section>

    <section class="pane grpp" aria-label="族群強弱">
      <div class="ph"><span class="t">族群強弱</span><span class="hint" id="grpHint"></span></div>
      <div class="breadth">
        <div><small>上漲</small><span class="v num up" id="bUp">—</span></div>
        <div><small>平盤</small><span class="v num flat" id="bFl">—</span></div>
        <div><small>下跌</small><span class="v num down" id="bDn">—</span></div>
      </div>
      <div class="bbar" id="bbar"></div>
      <div class="board" id="board"></div>
    </section>

    <section class="pane listp" aria-label="個股報價">
      <div class="ph"><span class="t" id="listTitle">全部個股</span><span style="flex:1"></span>
        <div class="tabs" id="sortTabs">
          <button data-s="chg" aria-pressed="true">漲幅</button><button data-s="chgA" aria-pressed="false">跌幅</button><button data-s="val" aria-pressed="false">成交值</button><button data-s="code" aria-pressed="false">代號</button>
        </div></div>
      <div class="list" id="list"></div>
    </section>
  </div>
</div>

<div class="ov" id="fOv" hidden><aside class="dr" aria-label="篩選器">
  <h2>篩選器 <button class="tbtn" id="fClose">完成</button></h2>
  <div><span class="lbl">快速條件</span><div class="chips" id="presets">
    <button class="chip" data-p="lu" aria-pressed="false">漲停</button><button class="chip" data-p="strong" aria-pressed="false">漲幅 ≥ 3%</button>
    <button class="chip" data-p="weak" aria-pressed="false">跌幅 ≥ 3%</button><button class="chip" data-p="ld" aria-pressed="false">跌停</button>
    <button class="chip" data-p="big" aria-pressed="false">成交值 ≥ 10 億</button></div></div>
  <div><span class="lbl">市場</span><div class="chips" id="mkts">
    <button class="chip" data-m="上市" aria-pressed="true">上市</button><button class="chip" data-m="上櫃" aria-pressed="true">上櫃</button><button class="chip" data-m="創新板" aria-pressed="true">創新板</button></div></div>
  <div><label class="lbl" for="pmin">股價（元）</label><div class="rg"><input id="pmin" type="number" inputmode="decimal" placeholder="最低"><span class="hint">–</span><input id="pmax" type="number" inputmode="decimal" placeholder="最高"></div></div>
  <div><label class="lbl" for="cmin">漲跌幅（%）</label><div class="rg"><input id="cmin" type="number" inputmode="decimal" placeholder="-10"><span class="hint">–</span><input id="cmax" type="number" inputmode="decimal" placeholder="10"></div></div>
  <div><label class="lbl" for="vmin">最低成交量（張）</label><input id="vmin" type="number" inputmode="numeric" placeholder="例：1000"></div>
  <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="onlyQ"> 只顯示有行情的股票</label>
  <button class="tbtn" id="reset">清除全部條件</button>
  <p class="hint">產業別依證交所／櫃買中心官方分類；熱門題材為常見概念股整理，僅供參考，不構成投資建議。</p>
</aside></div>

<div class="ov" id="dOv" hidden><aside class="dr" aria-label="行情資料">
  <h2>更新行情 <button class="tbtn" id="dClose">關閉</button></h2>
  <div class="status"><b id="ldTitle">行情尚未載入</b><span class="hint" id="ldSub"></span></div>
  <button class="tbtn hot" id="fetchBtn">自動下載證交所＋櫃買中心行情</button>
  <div class="dropz" id="drop">
    若自動下載失敗：開啟 <a href="https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL" target="_blank" rel="noopener" style="color:var(--accent)">上市日行情</a> 與
    <a href="https://www.tpex.org.tw/openapi/v1/tpex_mainboard_quotes" target="_blank" rel="noopener" style="color:var(--accent)">上櫃日行情</a>，全選複製後貼在下面，或存檔拖曳到這裡。
  </div>
  <textarea id="paste" placeholder="貼上 JSON 或 CSV"></textarea>
  <div style="display:flex;gap:6px;flex-wrap:wrap"><button class="tbtn hot" id="pasteGo">載入貼上的資料</button><label class="tbtn" for="file">上傳檔案</label><input type="file" id="file" accept=".json,.csv,.txt" multiple hidden></div>
  <p class="hint">報價為最近一個交易日收盤資料，不是盤中即時報價。漲跌幅 = 漲跌 ÷ 昨收。</p>
</aside></div>

  for(const o of arr){ const code=String(pick(o,PICK.code)||"").trim(); if(!BY[code]) continue;
    const close=num(pick(o,PICK.close)); let chg=num(pick(o,PICK.change)); const sign=o["漲跌(+/-)"]; if(sign!==undefined&&isFinite(chg)&&String(sign).includes("-")) chg=-Math.abs(chg);

  const h=L[hi].map(c=>c.trim()); return L.slice(hi+1).map(r=>Object.fromEntries(h.map((k,i)=>[k,(r[i]||"").trim().replace(/^=/,"").replace(/^"|"$/g,"")]))) }

  if(text[0]=="["||text[0]=="{"){ try{ let j=JSON.parse(text); if(!Array.isArray(j)) j=j.data||Object.values(j).find(Array.isArray)||[]; return ingestRows(j) }catch(e){ return -1 } }

let CUR=null, HIST=[];

  m=s.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/); if(m) return `${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`; m=s.match(/^(\d{4})(\d{2})(\d{2})$/); return m?`${m[1]}-${m[2]}-${m[3]}`:null };

  const chunks=text[0]=="{"||text[0]=="["?text.split(/\}\s*(?=\{)/).map((c,i,a)=>i<a.length-1?c+"}":c):[text];
  for(const ch of chunks){ if(ch[0]=="{"||ch[0]=="["){ try{ const j=JSON.parse(ch);
        if(j.data&&Array.isArray(j.data)) out.push(...histFromRows(j.data,1000)); else if(j.tables&&j.tables[0]&&j.tables[0].data) out.push(...histFromRows(j.tables[0].data,1)); else if(j.aaData) out.push(...histFromRows(j.aaData,1)) }catch(e){} continue }
    const R=parseCSVRaw(ch); const hi=R.findIndex(r=>r.some(c=>/^(日期|Date)$/i.test(c.trim()))); if(hi<0) continue;
    const h=R[hi].map(c=>c.trim()); const f=(...k)=>h.findIndex(x=>k.some(y=>x.toLowerCase()==y.toLowerCase()));
    const iD=f("日期","Date"),iO=f("開盤價","開盤","Open"),iH=f("最高價","最高","High"),iL=f("最低價","最低","Low"),iC=f("收盤價","收盤","Close"),iV=f("成交股數","成交張數","Volume"); const div=/股數|Volume/i.test(h[iV]||"")?1000:1;
    for(const r of R.slice(hi+1)){ const b={time:rocToISO(r[iD]||""),open:num(r[iO]),high:num(r[iH]),low:num(r[iL]),close:num(r[iC]),volume:num(r[iV])/div}; if(b.time&&isFinite(b.close)) out.push(b) } }

const sma=(a,n)=>a.map((_,i)=>i<n-1?null:a.slice(i-n+1,i+1).reduce((s,x)=>s+x,0)/n);
const ema=(a,n)=>{const k=2/(n+1);let e=null;return a.map((x,i)=>e=i==0?x:x*k+e*(1-k))};

function drawChart(){
  if(!CH) CH=makeCharts(); if(!CH) return;
  const s=CH.s,H=HIST,c=H.map(b=>b.close),up=CV("--up"),dn=CV("--down");
  IDX=new Map(H.map((b,i)=>[b.time,i]));
  IND={m5:sma(c,5),m20:sma(c,20),m60:sma(c,60),v5:sma(H.map(b=>b.volume),5),kd:kd(H),mc:macd(c),rs:rsi(c)};
  const L=(arr)=>H.map((b,i)=>arr[i]==null?{time:b.time}:{time:b.time,value:arr[i]});
  s.candle.setData(H.map(({time,open,high,low,close})=>({time,open,high,low,close})));
  s.ma5.setData(L(IND.m5)); s.ma20.setData(L(IND.m20)); s.ma60.setData(L(IND.m60));
  s.vol.setData(H.map((b,i)=>({time:b.time,value:b.volume||0,color:(i&&b.close<H[i-1].close)?dn:up}))); s.vma.setData(L(IND.v5));
  s.k.setData(L(IND.kd.map(x=>x.k))); s.d.setData(L(IND.kd.map(x=>x.d)));
  s.osc.setData(H.map((b,i)=>({time:b.time,value:IND.mc[i].osc,color:IND.mc[i].osc>=0?up:dn}))); s.dif.setData(L(IND.mc.map(x=>x.dif))); s.sig.setData(L(IND.mc.map(x=>x.sig)));
  s.rsi.setData(L(IND.rs));
  if(H.length){ CH.c.main.timeScale().setVisibleLogicalRange({from:Math.max(0,H.length-130),to:H.length+3}) }
  labels(H.length-1);
  $("sigs").innerHTML=H.length?signals(H).map(([t,a])=>`<span class="sg ${t}">${t=="bull"?"▲":t=="bear"?"▼":"●"} ${a}</span>`).join("")+'<span class="hint">　技術訊號依收盤自動計算，非買賣建議</span>':'<span class="hint">載入歷史日K後顯示均線、KD、MACD、RSI 訊號</span>';
  $("nohist").hidden=H.length>=60;
}
function monthsBack(k){ const o=[],d=new Date(); d.setDate(1); for(let i=0;i<k;i++){ o.unshift([d.getFullYear(),d.getMonth()+1]); d.setMonth(d.getMonth()-1) } return o }
function monthURL(s,y,m){ const mm=String(m).padStart(2,"0"); return s.mkt=="上市"?`https://www.twse.com.tw/exchangeReport/STOCK_DAY?response=json&date=${y}${mm}01&stockNo=${s.code}`:`https://www.tpex.org.tw/www/zh-tw/afterTrading/tradingStock?code=${s.code}&date=${y}/${mm}/01&response=json` }
function saveHist(){ try{ localStorage.setItem("h_"+CUR.code,JSON.stringify(HIST.slice(-260))) }catch(e){} }
async function fetchHist(s){
  let got=0;
  for(const [y,m] of monthsBack(7)){ if(CUR!==s) return;
    try{ const c=new AbortController(),t=setTimeout(()=>c.abort(),8000); const r=await fetch(monthURL(s,y,m),{signal:c.signal}); clearTimeout(t); const b=parseHistText(await r.text()); if(b.length){mergeHist(b);got++} }catch(e){ if(!got) break } }
  if(CUR!==s) return; if(got){ saveHist(); drawChart() }
  $("nhTitle").textContent=HIST.length?`已有 ${HIST.length} 個交易日，建議補到 60 天以上`:"這個頁面無法自動下載歷史日K";
  $("nhSub").innerHTML=`點下方月份開啟官方資料頁，全選複製後貼回這裡（可逐月貼，會自動合併）。或直接用右上的 Yahoo／TradingView 看完整 K 線。`;
}
function renderQuote(){
  if(!CUR){ $("quote").innerHTML=""; return } const q=Q[CUR.code]||{},c=cls(q.pct);
  $("quote").innerHTML=`<span class="nm">${esc(CUR.name)} <span class="num" style="color:var(--muted);font-weight:400">${CUR.code}</span></span>
   <span class="px num ${c}">${fmt(q.close)}</span><span class="num ${c}">${sgn(q.chg)}${isFinite(q.chg)?fmt(Math.abs(q.chg)):""} (${pctTxt(q.pct)})</span>
   <span class="meta num">開 ${fmt(q.open)}　高 <span class="up">${fmt(q.high)}</span>　低 <span class="down">${fmt(q.low)}</span>　量 ${isFinite(q.vol)?Math.round(q.vol).toLocaleString():"—"} 張</span>`;
}
function openStock(code){
  const s=BY[code]; if(!s) return; CUR=s;
  const lh=localHist(code);
  if(lh){ HIST=lh } else { try{ HIST=JSON.parse(localStorage.getItem("h_"+code)||"[]") }catch(e){ HIST=[] } }
  const th=Object.keys(THEMES).filter(k=>THEMES[k].includes(code));
  $("chName").textContent=`${s.code} ${s.name}・${s.mkt}・${s.ind}${th.length?"・"+th.join("、"):""}`;
  const y=s.code+(s.mkt=="上市"?".TW":".TWO"),tv=(s.mkt=="上市"?"TWSE:":"TPEX:")+s.code;
  $("extLinks").innerHTML=`<a href="https://tw.stock.yahoo.com/quote/${y}/technical-analysis" target="_blank" rel="noopener">Yahoo技術分析↗</a>　<a href="https://www.tradingview.com/chart/?symbol=${tv}" target="_blank" rel="noopener">TradingView↗</a>　<a href="https://tw.stock.yahoo.com/quote/${y}/news" target="_blank" rel="noopener">新聞↗</a>`;
  $("months").innerHTML=monthsBack(7).map(([yy,m])=>`<a href="${monthURL(s,yy,m)}" target="_blank" rel="noopener">${yy}/${String(m).padStart(2,"0")}</a>`).join("");
  $("nhTitle").textContent="正在下載歷史日K…"; $("nhSub").textContent="";
  document.querySelectorAll(".lr.on").forEach(e=>e.classList.remove("on")); document.querySelector(`.lr[data-code="${code}"]`)?.classList.add("on");
  try{ localStorage.setItem("twlast",code) }catch(e){}
  renderQuote(); drawChart(); if(!lh) fetchHist(s);
}

/* ---------- events ---------- */
$("board").onclick=e=>{ const b=e.target.closest("[data-g]"); if(!b) return; st.grp=st.grp==b.dataset.g?null:b.dataset.g; st.limit=150; renderAll() };
$("list").onclick=e=>{ if(e.target.id=="more"){ st.limit+=150; renderAll(); return } const r=e.target.closest("[data-code]"); if(r) openStock(r.dataset.code) };
$("sortTabs").onclick=e=>{ const b=e.target.closest("[data-s]"); if(!b) return; st.sort=b.dataset.s; document.querySelectorAll("#sortTabs button").forEach(x=>x.setAttribute("aria-pressed",x==b)); renderAll() };
const setGM=m=>{ st.gm=m; st.grp=null; $("gm-ind").setAttribute("aria-pressed",m=="ind"); $("gm-thm").setAttribute("aria-pressed",m=="thm"); renderAll() };
$("gm-ind").onclick=()=>setGM("ind"); $("gm-thm").onclick=()=>setGM("thm");
$("openFilter").onclick=()=>{$("fOv").hidden=false}; $("fClose").onclick=()=>{$("fOv").hidden=true};
$("openData").onclick=()=>{$("dOv").hidden=false}; $("dClose").onclick=()=>{$("dOv").hidden=true};
["fOv","dOv"].forEach(id=>$(id).addEventListener("click",e=>{ if(e.target.id==id) $(id).hidden=true }));
document.addEventListener("keydown",e=>{ if(e.key=="Escape"){ $("fOv").hidden=true; $("dOv").hidden=true; $("sug").hidden=true } });
const markF=()=>$("openFilter").setAttribute("aria-pressed",!!filtersOn());
for(const id of ["pmin","pmax","cmin","cmax","vmin"]) $(id).addEventListener("input",e=>{ st[id]=e.target.value; markF(); renderAll() });
$("onlyQ").onchange=e=>{ st.onlyQ=e.target.checked; markF(); renderAll() };
$("mkts").onclick=e=>{ const b=e.target.closest("[data-m]"); if(!b) return; const m=b.dataset.m; st.mk.has(m)?st.mk.delete(m):st.mk.add(m); b.setAttribute("aria-pressed",st.mk.has(m)); markF(); renderAll() };
$("presets").onclick=e=>{ const b=e.target.closest("[data-p]"); if(!b) return; st.preset=st.preset==b.dataset.p?null:b.dataset.p; document.querySelectorAll("#presets .chip").forEach(c=>c.setAttribute("aria-pressed",c.dataset.p==st.preset)); markF(); renderAll() };
$("reset").onclick=()=>{ Object.assign(st,{pmin:"",pmax:"",cmin:"",cmax:"",vmin:"",onlyQ:false,preset:null,mk:new Set(["上市","上櫃","創新板"])}); for(const id of ["pmin","pmax","cmin","cmax","vmin"]) $(id).value=""; $("onlyQ").checked=false;
  document.querySelectorAll("#presets .chip").forEach(c=>c.setAttribute("aria-pressed","false")); document.querySelectorAll("#mkts .chip").forEach(c=>c.setAttribute("aria-pressed","true")); markF(); renderAll() };
$("fetchBtn").onclick=autoFetch;
$("file").onchange=e=>handleFiles([...e.target.files]);
$("pasteGo").onclick=()=>{ const n=ingestText($("paste").value); if(n>0){ $("paste").value=""; afterLoad("已載入貼上的資料") } else setStatus("貼上的內容讀不到股票行情","請確認複製了整頁 JSON（從 [ 開頭）或 CSV。") };
const dz=$("drop"); ["dragenter","dragover"].forEach(t=>dz.addEventListener(t,e=>{e.preventDefault();dz.classList.add("over")})); ["dragleave","drop"].forEach(t=>dz.addEventListener(t,e=>{e.preventDefault();dz.classList.remove("over")}));
dz.addEventListener("drop",e=>handleFiles([...e.dataTransfer.files]));
$("hGo").onclick=()=>{ const b=parseHistText($("hPaste").value); if(b.length){ mergeHist(b); saveHist(); $("hPaste").value=""; drawChart(); $("nhTitle").textContent=`已有 ${HIST.length} 個交易日，可繼續貼其他月份` } else $("nhTitle").textContent="讀不到日K資料，請貼上月份頁面的完整內容" };
$("hFile").onchange=async e=>{ for(const f of e.target.files) mergeHist(parseHistText(await f.text())); saveHist(); drawChart() };
// symbol search
let sugI=0,sugL=[];
function showSug(){ const v=$("sym").value.trim().toLowerCase(); if(!v){ $("sug").hidden=true; return }
  sugL=STOCKS.filter(s=>s.code.startsWith(v)||s.name.toLowerCase().includes(v)).slice(0,12); sugI=0;
  $("sug").innerHTML=sugL.map((s,i)=>`<button data-code="${s.code}" class="${i==0?"on":""}"><span class="num">${s.code}</span><span>${esc(s.name)}</span><span class="hint">${s.ind}</span></button>`).join("")||'<div class="empty">找不到</div>'; $("sug").hidden=false }
$("sym").addEventListener("input",showSug);
$("sym").addEventListener("keydown",e=>{ if(e.key=="ArrowDown"||e.key=="ArrowUp"){ e.preventDefault(); sugI=(sugI+(e.key=="ArrowDown"?1:-1)+sugL.length)%Math.max(sugL.length,1); [...$("sug").children].forEach((c,i)=>c.classList.toggle("on",i==sugI)) }
  if(e.key=="Enter"&&sugL[sugI]){ openStock(sugL[sugI].code); $("sym").value=""; $("sug").hidden=true; $("sym").blur() } });
$("sug").onclick=e=>{ const b=e.target.closest("[data-code]"); if(b){ openStock(b.dataset.code); $("sym").value=""; $("sug").hidden=true } };
$("sym").addEventListener("blur",()=>setTimeout(()=>$("sug").hidden=true,150));

/* ---------- local data.js (from twstock_update.py) ---------- */
const TD=window.TW_DATA&&window.TW_DATA.dates&&window.TW_DATA.s?window.TW_DATA:null;
function loadLocal(){
  const n=TD.dates.length-1; Q={}; DATES=new Set([TD.dates[n].replace(/-/g,"")]);
  for(const code in TD.s){ const a=TD.s[code], L=a[a.length-1]; if(!L||L[0]!==n) continue;
    const P=a.length>1&&a[a.length-2][0]===n-1?a[a.length-2]:null; const prev=P?P[4]:NaN;
    Q[code]={close:L[4],chg:L[4]-prev,pct:prev>0?(L[4]-prev)/prev*100:NaN,open:L[1],high:L[2],low:L[3],vol:L[5],val:L[6]*1e5} }
  $("dateLbl").textContent=`資料日 ${TD.dates[n].replace(/-/g,"/")}・更新 ${TD.updated}`;
  setStatus(`已讀取本機資料：${Object.keys(Q).length.toLocaleString()} 檔`,`${TD.dates[0]} ~ ${TD.dates[n]}，共 ${TD.dates.length} 個交易日。每天執行更新程式後重新整理頁面即可。`);
}
function localHist(code){ const a=TD&&TD.s[code]; return a?a.map(r=>({time:TD.dates[r[0]],open:r[1],high:r[2],low:r[3],close:r[4],volume:r[5]})):null }

/* ---------- boot ---------- */
setStatus("行情尚未載入",`已收錄 ${STOCKS.length.toLocaleString()} 檔上市櫃股票。`);
if(TD){ loadLocal(); renderAll() } else if(loadQ()) afterLoad("沿用上次載入的行情"); else renderAll();
let last="2330"; try{ last=localStorage.getItem("twlast")||"2330" }catch(e){}
openStock(BY[last]?last:"2330");
if(!TD) autoFetch().then(ok=>{ if(!ok&&!Object.keys(Q).length) $("dOv").hidden=false });
</script>
